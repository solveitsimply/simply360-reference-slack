AWSTemplateFormatVersion: '2010-09-09'
Description: Dev-only GitHub OIDC deployment roles for the Simply360 Slack reference stack.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$'
  HostedZoneId:
    Type: String
    AllowedPattern: '^Z[A-Z0-9]+$'
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$'

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: simply360-reference-slack-dev-592668326732
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: simply360:reference-repository
          Value: simply360-reference-slack
        - Key: simply360:environment
          Value: dev

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  StackExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: simply360-reference-slack-dev-stack-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageExactDevFoundation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateExactHttpApi
                Effect: Allow
                Action: apigateway:POST
                Resource: arn:aws:apigateway:us-east-1::/apis
                Condition:
                  StringEquals:
                    apigateway:Request/ApiName: Simply360ReferenceSlackDev-http
                  Bool:
                    apigateway:Request/DisableExecuteApiEndpoint: 'true'
              - Sid: ManageHttpApiResources
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                Resource: arn:aws:apigateway:us-east-1::/apis/*
              - Sid: CreateReviewedRegionalDomain
                Effect: Allow
                Action:
                  - apigateway:POST
                  - apigateway:PUT
                Resource: arn:aws:apigateway:us-east-1::/domainnames
                Condition:
                  ForAllValues:StringEquals:
                    apigateway:Request/EndpointType: REGIONAL
                    apigateway:Request/SecurityPolicy: TLS_1_2
                  'Null':
                    apigateway:Request/EndpointType: 'false'
                    apigateway:Request/SecurityPolicy: 'false'
              - Sid: ManageExactDomainAndMapping
                Effect: Allow
                Action:
                  - apigateway:AddCertificateToDomain
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:RemoveCertificateFromDomain
                  - apigateway:UpdateDomainNamePolicy
                Resource:
                  - arn:aws:apigateway:us-east-1::/domainnames/reference-slack.dev.simply360.app
                  - arn:aws:apigateway:us-east-1::/domainnames/reference-slack.dev.simply360.app/apimappings
                  - arn:aws:apigateway:us-east-1::/domainnames/reference-slack.dev.simply360.app/apimappings/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:PutRetentionPolicy
                Resource: arn:aws:logs:us-east-1:*:log-group:/aws/apigateway/Simply360ReferenceSlackDev*
              - Sid: ManageExactHelloLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:PutRetentionPolicy
                Resource: arn:aws:logs:us-east-1:592668326732:log-group:/aws/lambda/simply360-reference-slack-dev-hello
              - Sid: ManageExactHelloTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                Resource: arn:aws:dynamodb:us-east-1:592668326732:table/simply360-reference-slack-dev-hello-state
              - Sid: ManageExactHelloFunction
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionConcurrency
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:PutFunctionConcurrency
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: arn:aws:lambda:us-east-1:592668326732:function:simply360-reference-slack-dev-hello
              - Sid: PassExactHelloRuntimeRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt HelloRuntimeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ReadExactHelloArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${ArtifactBucket.Arn}/simply360-reference-slack/*
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
              - Effect: Allow
                Action: route53:GetChange
                Resource: arn:aws:route53:::change/*
              - Effect: Allow
                Action: acm:DescribeCertificate
                Resource: !Ref CertificateArn
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecretVersionIds
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:UpdateSecret
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:s360/reference-slack/dev/runtime-*

  HelloRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: simply360-reference-slack-dev-runtime
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ExactHelloRuntimeData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactHelloState
                Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactGetItems
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource: arn:aws:dynamodb:us-east-1:592668326732:table/simply360-reference-slack-dev-hello-state
              - Sid: ExactHelloRuntimeSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: arn:aws:secretsmanager:us-east-1:592668326732:secret:s360/reference-slack/dev/runtime-*
              - Sid: ExactHelloRuntimeLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:us-east-1:592668326732:log-group:/aws/lambda/simply360-reference-slack-dev-hello:*

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: simply360-reference-slack-dev-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:solveitsimply@67548625/simply360-reference-slack@1305919064:environment:dev
      Policies:
        - PolicyName: DeployExactDevStack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                Resource: arn:aws:cloudformation:us-east-1:*:stack/Simply360ReferenceSlackDev/*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt StackExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub ${ArtifactBucket.Arn}/simply360-reference-slack/*

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  StackExecutionRoleArn:
    Value: !GetAtt StackExecutionRole.Arn
  HelloRuntimeRoleArn:
    Value: !GetAtt HelloRuntimeRole.Arn
