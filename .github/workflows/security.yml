# Required dependency review on PRs plus SBOM/provenance on protected `dev`.
# Every third-party action is pinned to a full commit SHA.
name: security

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  dependency-review:
    name: security
    # PR-only: fails the PR if a newly introduced dependency has a known
    # vulnerability or a disallowed license.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: moderate

  sbom-provenance:
    # Push-only: emit an SPDX SBOM and a signed build-provenance attestation
    # for the built artifact.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      # The build-provenance wrapper at v2.1.0 calls actions/attest through a
      # mutable tag, which the repository's full-SHA policy rejects. Invoke the
      # wrapper's two exact components directly so the same SLSA predicate is
      # generated and attested without weakening that policy.
      - name: Generate build provenance predicate
        id: build-provenance
        uses: actions/attest-build-provenance/predicate@36fa7d009e22618ca7cd599486979b8150596c74 # predicate@1.1.4

      - name: Attest build provenance
        uses: actions/attest@63d2e98e267398337e9a17ec68a5c8d936cb9247 # v2.1.0
        with:
          subject-path: "dist/**/*.js"
          predicate-type: ${{ steps.build-provenance.outputs.predicate-type }}
          predicate: ${{ steps.build-provenance.outputs.predicate }}
